{% extends 'base.html' %}
{% block title %}Register - JobConnect{% endblock %}

{% block content %}
<style>
    .auth-page { min-height: 85vh; display: flex; align-items: center; padding: 3rem 0; }
    .role-option { cursor: pointer; }
    .role-option input { display: none; }
    .role-box {
        border: 2px solid var(--border);
        border-radius: 12px;
        padding: 0.8rem 1rem;
        transition: all 0.2s;
        display: flex; align-items: center; gap: 10px;
    }
    .role-option input:checked + .role-box {
        border-color: var(--accent);
        background: rgba(245,166,35,0.07);
    }
    .role-box:hover { border-color: var(--muted); }
    .role-icon {
        width: 34px; height: 34px; border-radius: 8px;
        background: var(--bg3); display: flex; align-items: center; justify-content: center;
        color: var(--accent); font-size: 0.9rem; flex-shrink: 0;
    }
</style>
<div class="auth-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="text-center mb-4">
                    <h2 style="font-weight:800;letter-spacing:-1px;">Create Account</h2>
                    <p style="color:var(--muted);">Join JobConnect today</p>
                </div>
                <div class="card p-4">
                    <form method="POST" action="{{ url_for('auth.register') }}">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" name="name" class="form-control" required placeholder="Your full name">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" name="email" class="form-control" required placeholder="your@email.com">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Phone Number</label>
                            <input type="text" name="phone" class="form-control" required placeholder="+263700000000">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" required placeholder="Choose a password">
                        </div>
                        <div class="mb-4">
                            <label class="form-label">I am registering as</label>
                            <div class="d-flex flex-column gap-2">
                                <label class="role-option">
                                    <input type="radio" name="role" value="employer" required>
                                    <div class="role-box">
                                        <div class="role-icon"><i class="fas fa-building"></i></div>
                                        <div>
                                            <div style="font-weight:700;font-size:0.88rem;font-family:'Syne',sans-serif;">Employer</div>
                                            <div style="color:var(--muted);font-size:0.75rem;">Post a job listing</div>
                                        </div>
                                    </div>
                                </label>
                                <label class="role-option">
                                    <input type="radio" name="role" value="jobseeker">
                                    <div class="role-box">
                                        <div class="role-icon"><i class="fas fa-user"></i></div>
                                        <div>
                                            <div style="font-weight:700;font-size:0.88rem;font-family:'Syne',sans-serif;">Job Seeker</div>
                                            <div style="color:var(--accent);font-size:0.75rem;font-weight:700;">FREE Registration</div>
                                        </div>
                                    </div>
                                </label>
                                <label class="role-option">
                                    <input type="radio" name="role" value="advertiser">
                                    <div class="role-box">
                                        <div class="role-icon"><i class="fas fa-bullhorn"></i></div>
                                        <div>
                                            <div style="font-weight:700;font-size:0.88rem;font-family:'Syne',sans-serif;">Advertiser</div>
                                            <div style="color:var(--muted);font-size:0.75rem;">Advertise your product or service · from FREE0</div>
                                        </div>
                                    </div>
                                </label>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">Create Account</button>
                    </form>
                    <hr style="border-color:var(--border);" class="my-3">
                    <p class="text-center mb-0" style="font-size:0.9rem;color:var(--muted);">
                        Already have an account? <a href="{{ url_for('auth.login') }}" style="color:var(--accent);">Login here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
