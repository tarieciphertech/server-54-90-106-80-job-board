{% extends 'base.html' %}
{% block title %}Login - JobConnect{% endblock %}

{% block content %}
<div style="min-height:85vh;display:flex;align-items:center;padding:3rem 0;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="text-center mb-4">
                    <h2 style="font-weight:800;letter-spacing:-1px;">Welcome Back</h2>
                    <p style="color:var(--muted);">Login to your JobConnect account</p>
                </div>
                <div class="card p-4">
                    <form method="POST" action="{{ url_for('auth.login') }}">
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" name="email" class="form-control" required placeholder="your@email.com">
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" required placeholder="Your password">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">Login</button>
                    </form>
                    <hr style="border-color:var(--border);" class="my-3">
                    <p class="text-center mb-0" style="font-size:0.9rem;color:var(--muted);">
                        No account yet? <a href="{{ url_for('auth.register') }}" style="color:var(--accent);">Register here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
